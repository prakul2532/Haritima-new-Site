<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="SignUp.css">
    <title>Sign-Up</title>
    <style>
        
    </style>
</head>
<body>
    <!-- whole body box -->
    <div class="pageAlignment">
        <div class="formAlignment2">
            <form action="">
                <fieldset class="fieldsetStyling">
                    <legend class="legendFont">SIGN UP</legend>
                    <div class="formSize">
                        <div class="form">
                            <label for="username" class="labelStyling">USERNAME</label>
                            <input type="text" id="username" class="boxStyling" placeholder="Type a username for yourself">
                            <label for="password" class="labelStyling">PASSWORD</label>
                            <input type="text" id="password" class="boxStyling" placeholder="Type a strong password">
                            <label for="email" class="labelStyling">Email</label>
                            <input type="text" id="email" class="boxStyling" placeholder="Type your email id">
                            <p onclick="FormChange2()" class="loginLink">have an account? login through it</p>
                        </div>
                        <input type="submit" class="submitButtonStyling" style="font-size: 18px;" value="SUBMIT">
                    </div>
                </fieldset>
            </form>
        </div>
        <div class="imageSignUpAlignment">
            <img src="../static/image_SignUP.png" class="imageSignUp" alt="errorLoading">
        </div>
        <div class="formAlignment">
            <form action="">
                <fieldset class="fieldsetStyling">
                    <legend class="legendFont">LOGIN</legend>
                    <div class="formSize">
                        <div class="form">
                            <label for="username" class="labelStyling">USERNAME</label>
                            <input type="text" class="boxStyling" name="username" id="username" placeholder="Type your username">
                            <label for="password" class="labelStyling">PASSWORD</label>
                            <input type="password" class="boxStyling" name="password" id="password" placeholder="Type your password">
                            <p onclick="FormChange()" class="loginLink">new user ? let's sign up</p>
                        </div>
                        <input type="submit" class="submitButtonStyling" style="font-size: 18px;" value="submit">
                    </div>
                </fieldset>
            </form>
        </div>
    </div>
    <script src="SignUp.js"></script>
</body>
</html>
