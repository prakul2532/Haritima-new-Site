<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="SignUp.css">
    <title>Sign-Up</title>
</head>
<body>
    <!-- whole body box -->
    <div class="pageAlignment">
        <div class="formAlignment">
            <form action="">
                <fieldset>
                    <legend>SIGN UP</legend>
                    <div class="formSize">
                        <div class="form">
                            <label for="username">USERNAME</label>
                            <input type="text" id="username" placeholder="Type a username for yourself">
                            <label for="password">PASSWORD</label>
                            <input type="password" id="password" placeholder="Type a strong password">
                            <label for="email">Email</label>
                            <input type="text" id="email" placeholder="Type your email id">
                        </div>
                        <input type="submit" value="submit">
                    </div>
                </fieldset>
            </form>
        </div>
        <div class="imageSignUpAlignment">
            <img src="../static/image_SignUP.png" class="imageSignUp" alt="errorLoading">
        </div>
    </div>
    <script src="SignUp.js"></script>
</body>
</html>
